namespace: mysql

replicas: 1
image:
  repo: mysql
  tag: "8.0"
port: 3306

secrets:
  MYSQL_ROOT_PASSWORD: "<REPLACE_WITH_SECRET>"
  MYSQL_USER: "<REPLACE_WITH_SECRET>"
  MYSQL_PASSWORD: "<REPLACE_WITH_SECRET>"

resources:
  requests:
    cpu: 200m
    memory: 1Gi
    storage: 1Gi
  limits:
    cpu: 200m
    memory: 1Gi