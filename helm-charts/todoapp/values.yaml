mysql:
  secrets:
    MYSQL_ROOT_PASSWORD: 12345
    MYSQL_USER: app_user
    MYSQL_PASSWORD: 1234

todoapp:
  namespace: todoapp
  image:
    repository: ikulyk404/todoapp
    tag: "4.0.1"

  resources:
    requests:
      memory: "256Mi"
      cpu: "150m"
    limits:
      memory: "256Mi"
      cpu: "150m"

  secrets:
    SECRET_KEY: "<REPLACE_WITH_SECRET>"
    DB_NAME: "<REPLACE_WITH_SECRET>"
    DB_USER: "<REPLACE_WITH_SECRET>"
    DB_PASSWORD: "<REPLACE_WITH_SECRET>"
    DB_HOST: "<REPLACE_WITH_SECRET>"

  hpa:
    minReplicas: 2
    maxReplicas: 5
    cpu:
      avarageUtilization: 70
    memory:
      avarageUtilization: 70

  volumes:
    persistentVolume:
      capacity: "1Gi"
    persistentVolumeClaim:
      requestStorage: "1Gi"