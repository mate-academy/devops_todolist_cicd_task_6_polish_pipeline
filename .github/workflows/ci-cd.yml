name: CI/CD

on:
  pull_request:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Where to deploy"
        required: true
        type: choice
        options:
          - development
          - staging
      matrix_artifact:
        description: "Which matrix artifact to use"
        required: true
        type: choice
        options:
          - artifact-ubuntu-latest-py3.8
          - artifact-ubuntu-latest-py3.9
          - artifact-windows-latest-py3.8
          - artifact-windows-latest-py3.9

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # <-- IMPORTANT: поменяй на свой DockerHub repo
  DockerImageName: ikulyk404/todoapp

jobs:
  python_ci:
    name: Python CI
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.9"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        shell: bash

      - name: Run tests
        run: |
          python manage.py test
        shell: bash

      - name: Create artifact
        run: |
          echo "os=${{ matrix.os }}" > meta.txt
          echo "python=${{ matrix.python-version }}" >> meta.txt
          echo "sha=${{ github.sha }}" >> meta.txt
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.os }}-py${{ matrix.python-version }}
          path: meta.txt

  docker_build_push:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs: [python_ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set IMAGE_TAG
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DockerImageName }}:latest
            ${{ env.DockerImageName }}:${{ env.IMAGE_TAG }}

  deploy_manual:
    name: Deploy (manual)
    runs-on: ubuntu-latest
    needs: [python_ci]
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ inputs.target_env }}

    steps:
      - uses: actions/checkout@v4

      - name: Download selected artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.matrix_artifact }}

      - name: Show artifact content
        run: |
          echo "Selected artifact: ${{ inputs.matrix_artifact }}"
          echo "Target env: ${{ inputs.target_env }}"
          cat meta.txt

      # Тут обычно делают реальные шаги деплоя (kubectl/helm/kind и т.д.)
      # Но ключевое для задания: inputs + environment + approval на staging
