name: Reusable Deploy Workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      docker_image_name:
        required: true
        type: string

  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      docker_image_name:
        required: true
        type: string

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.12.0

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1
        with:
          config: ./cluster.yml

      - name: Create Registry Secret
        run: |
          kubectl create secret docker-registry regcred \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username=${{ secrets.DOCKERHUB_USERNAME }} \
            --docker-password=${{ secrets.DOCKERHUB_TOKEN }} \
            --docker-email=user@example.com || true

      - name: Helm Install (Dry Run)
        run: |
          helm install --dry-run --debug todo-release ./helm-charts/todoapp \
            --set image.repository=${{ inputs.docker_image_name }} \
            --set image.tag=${{ inputs.image_tag }} \
            --set imagePullSecrets[0].name=regcred

      - name: Helm Upgrade --install (Atomic)
        run: |
          helm upgrade --install todo-release ./helm-charts/todoapp \
            --atomic \
            --wait \
            --timeout 5m \
            --set image.repository=${{ inputs.docker_image_name }} \
            --set image.tag=${{ inputs.image_tag }} \
            --set imagePullSecrets[0].name=regcred