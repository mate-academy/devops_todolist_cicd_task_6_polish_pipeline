name: Reusable Deployment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      version:
        required: true
        type: string
      helm-values-path:
        required: false
        type: string
        default: ''
      helm-release-name:
        required: false
        type: string
        default: 'todoapp'

env:
  DockerImageName: ${{ secrets.DOCKERHUB_USERNAME }}/todoapp

jobs:
  deployment:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.10.0

      - name: Download Helm package artifact
        uses: actions/download-artifact@v4
        with:
          name: helm-package

      - name: Set Up Helm
        uses: azure/setup-helm@v4.2.0

      - name: Deploy helm
        run: |
          VALUES_FLAG=""
          VAL_PATH="${{ inputs.helm-values-path }}"
          if [ -n "$VAL_PATH" ]; then
            if [ -f "$VAL_PATH" ]; then
              VALUES_FLAG="-f $VAL_PATH"
            elif [ -f "helm-charts/$VAL_PATH" ]; then
              VALUES_FLAG="-f helm-charts/$VAL_PATH"
            elif [ -f "${VAL_PATH#./}" ]; then
              VALUES_FLAG="-f ${VAL_PATH#./}"
            elif [ -f "helm-charts/${VAL_PATH#./}" ]; then
              VALUES_FLAG="-f helm-charts/${VAL_PATH#./}"
            fi
          fi

          helm upgrade --install --wait --timeout 500s --debug \
            ${{ inputs.helm-release-name }} ./todoapp-*.tgz $VALUES_FLAG \
            --set image.repository=${{ env.DockerImageName }} \
            --set image.tag=${{ inputs.version }}

      - name: Debug Kubernetes Pods on Failure
        if: failure()
        run: |
          echo "=== Kube Pods Status ==="
          kubectl get pods -A
          echo "=== Describe Pods in todoapp namespace ==="
          kubectl describe pods -n todoapp || true
          echo "=== Logs for TodoApp ==="
          kubectl logs -n todoapp -l app.kubernetes.io/name=todoapp --tail=100 || true
