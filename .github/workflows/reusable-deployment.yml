name: helm-upgrade
run-name: ${{ github.actor }} - ${{ github.ref_name }}

on:
  workflow_call:
    inputs:
      environment:
        required: true
        description: 'Environment to deploy to'
        type: string
      version:
        required: true
        description: 'Version of the image to deploy'
        type: string
      helm-values-path:
        description: 'Path to the helm values file'
        type: string
        default: './todoapp/values.yaml'
      helm-release-name:
        description: 'Name of the helm release'
        type: string
        default: todoapp

jobs:
  deploy-helm:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    name: ${{ inputs.environment }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: helm-package
          path: .

      - uses: actions/download-artifact@v7
        with:
          name: helm-artifacts
          path: .

      - uses: actions/download-artifact@v7
        with:
          name: kind-cluster
          path: .

      - name: Create Cluster
        uses: helm/kind-action@v1
        with:
          config: ./cluster.yml

      - name: Set Up Helm
        uses: azure/setup-helm@v4.2.0

      - name: Trial run of the realese
        run: |
          helm install ${{ inputs.helm-release-name }} ./*.tgz -f ${{ inputs.helm-values-path }} \
            --set todoapp.image.repository="trickykot3/todoapp" \
            --set todoapp.image.tag="${{ inputs.version }}" \
            --dry-run

      - name: Install or Update realese
        run: |
          helm upgrade --install --atomic --wait --timeout 1800s --debug \
            ${{ inputs.helm-release-name }} ./*.tgz \
            -f ${{ inputs.helm-values-path }} \
            --set mysql.secrets.MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD }}" \
            --set mysql.secrets.MYSQL_USER="${{ secrets.MYSQL_USER }}" \
            --set mysql.secrets.MYSQL_PASSWORD="${{ secrets.MYSQL_PASSWORD }}" \
            --set todoapp.secrets.SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            --set todoapp.secrets.DB_NAME="${{ secrets.DB_NAME }}" \
            --set todoapp.secrets.DB_USER="${{ secrets.DB_USER }}" \
            --set todoapp.secrets.DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --set todoapp.secrets.DB_HOST="${{ secrets.DB_HOST }}" \
            --set todoapp.image.repository="trickykot3/todoapp" \
            --set todoapp.image.tag="${{ inputs.version }}"