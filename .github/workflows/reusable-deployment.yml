name: helm-upgrade
run-name: ${{ github.actor }} - ${{ github.ref_name }}

on:
  workflow_call:
    inputs:
      environment:
        required: true
        description: 'Environment to deploy to'
        type: string
      version:
        required: true
        type: string
      helm-values-path:
        type: string
        default: './todoapp/values.yaml'
      helm-release-name:
        default: todoapp
        type: string

jobs:
  deploy-helm:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Download Helm package
        uses: actions/download-artifact@v4
        with:
          name: helm-package
          path: .

      - name: Download Helm artifacts
        uses: actions/download-artifact@v4
        with:
          name: helm-artifacts
          path: .

      - name: Download Kind cluster
        uses: actions/download-artifact@v4
        with:
          name: kind-cluster
          path: .

      - name: Set Up Helm
        uses: azure/setup-helm@v4.2.0

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1
        with:
          config: ./cluster.yml

      - name: Dry Run Helm
        run: |
          helm install --dry-run ${{ inputs.helm-release-name }} ./todoapp-*.tgz \
            -f ${{ inputs.helm-values-path }} \
            --set mysql.secrets.MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD || 'rootpass123' }}" \
            --set mysql.secrets.MYSQL_USER="${{ secrets.MYSQL_USER || 'todouser' }}" \
            --set mysql.secrets.MYSQL_PASSWORD="${{ secrets.MYSQL_PASSWORD || 'todopass123' }}" \
            --set todoapp.secrets.SECRET_KEY="${{ secrets.APP_SECRET_KEY || 'django-insecure-secret-key-12345' }}" \
            --set todoapp.secrets.DB_NAME="${{ secrets.APP_DB_NAME || 'tododb' }}" \
            --set todoapp.secrets.DB_USER="${{ secrets.MYSQL_USER || 'todouser' }}" \
            --set todoapp.secrets.DB_PASSWORD="${{ secrets.MYSQL_PASSWORD || 'todopass123' }}" \
            --set todoapp.secrets.DB_HOST="${{ secrets.APP_DB_HOST || 'mysql.mysql.svc.cluster.local' }}" \
            --set todoapp.image.repository="${{ secrets.DOCKERHUB_USERNAME || 'baga090' }}/todoapp" \
            --set todoapp.image.tag=${{ inputs.version }}

      - name: Deploy helm to Development
        run: |
          helm upgrade --install --atomic --wait --timeout 300s --debug ${{ inputs.helm-release-name }} ./todoapp-*.tgz \
            -f ${{ inputs.helm-values-path }} \
            --set mysql.secrets.MYSQL_ROOT_PASSWORD="${{ secrets.MYSQL_ROOT_PASSWORD || 'rootpass123' }}" \
            --set mysql.secrets.MYSQL_USER="${{ secrets.MYSQL_USER || 'todouser' }}" \
            --set mysql.secrets.MYSQL_PASSWORD="${{ secrets.MYSQL_PASSWORD || 'todopass123' }}" \
            --set todoapp.secrets.SECRET_KEY="${{ secrets.APP_SECRET_KEY || 'django-insecure-secret-key-12345' }}" \
            --set todoapp.secrets.DB_NAME="${{ secrets.APP_DB_NAME || 'tododb' }}" \
            --set todoapp.secrets.DB_USER="${{ secrets.MYSQL_USER || 'todouser' }}" \
            --set todoapp.secrets.DB_PASSWORD="${{ secrets.MYSQL_PASSWORD || 'todopass123' }}" \
            --set todoapp.secrets.DB_HOST="${{ secrets.APP_DB_HOST || 'mysql.mysql.svc.cluster.local' }}" \
            --set todoapp.image.repository="${{ secrets.DOCKERHUB_USERNAME || 'baga090' }}/todoapp" \
            --set todoapp.image.tag=${{ inputs.version }}