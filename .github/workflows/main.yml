name: python-deployment

run-name: ${{ github.actor }} - ${{ github.ref_name }} - ${{ github.sha }}

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      artifact:
        description: "Select artifact to deploy"
        required: true
        type: choice
        options:
          - ubuntu-3.8
          - ubuntu-3.9
          - windows-3.8
          - windows-3.9

env:
  DockerImageName: todoapp

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-ci:
    name: Python CI (${{ matrix.os-name }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os-name: ubuntu
            python-version: "3.8"

          - runner: ubuntu-latest
            os-name: ubuntu
            python-version: "3.9"

          - runner: windows-latest
            os-name: windows
            python-version: "3.8"

          - runner: windows-latest
            os-name: windows
            python-version: "3.9"

    defaults:
      run:
        working-directory: ./src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install coverage flake8
          pip install -r requirements.txt

      - name: Run tests
        shell: bash
        run: python manage.py test

      - name: Coverage
        shell: bash
        run: |
          coverage run --source='.' manage.py test
          coverage report

      - name: Lint
        shell: bash
        run: |
          flake8 . --show-source --statistics --exit-zero
          flake8 . --exit-zero --max-complexity=6

      - name: Upload Python artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os-name }}-${{ matrix.python-version }}
          path: ./src

      - name: Upload Helm artifacts
        if: matrix.runner == 'ubuntu-latest' && github.ref_name == 'main'
        uses: actions/upload-artifact@v4
        with:
          name: helm-artifacts
          path: helm-charts

      - name: Upload Kind cluster
        if: matrix.runner == 'ubuntu-latest' && github.ref_name == 'main'
        uses: actions/upload-artifact@v4
        with:
          name: kind-cluster
          path: cluster.yml

  docker-ci:
    name: Docker Build & Push
    if: github.ref_name == 'main'
    needs: python-ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./src
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DockerImageName }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DockerImageName }}:latest

  helm-ci:
    name: Helm CI
    if: github.ref_name == 'main'
    needs: python-ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: helm-artifacts
          path: .

      - uses: azure/setup-helm@v4

      - name: Helm Lint
        run: helm lint ./todoapp

      - name: Helm Template
        run: helm template todoapp ./todoapp -f ./todoapp/values.yaml

      - name: Helm Package
        run: helm package ./todoapp

      - uses: actions/upload-artifact@v4
        with:
          name: helm-package
          path: ./*.tgz

  deploy-dev:
    name: Deploy Development
    if: github.ref_name == 'main'
    needs:
      - docker-ci
      - helm-ci

    uses: ./.github/workflows/reusable-deployment.yml

    secrets: inherit

    with:
      environment: development
      version: ${{ github.sha }}

  deploy-staging:
    name: Deploy Staging
    if: github.ref_name == 'main'
    needs: deploy-dev

    uses: ./.github/workflows/reusable-deployment.yml

    secrets: inherit

    with:
      environment: staging
      version: ${{ github.sha }}
      helm-values-path: ./todoapp/values/stg.yaml
      helm-release-name: todoapp-staging

  manual-deploy:
    name: Manual Artifact Deployment
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Download selected artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact }}
          path: artifact

      - name: Show selected artifact
        run: |
          echo "Selected artifact:"
          echo "${{ github.event.inputs.artifact }}"
          ls -R artifact
