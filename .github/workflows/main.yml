name: Python CI

run-name: ${{ github.actor }} - ${{ github.ref_name }} - ${{ github.sha }}

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      artifact:
        description: "Choose artifact to deploy"
        required: true
        type: choice
        options:
          - ubuntu-3.8
          - ubuntu-3.9
          - windows-3.8
          - windows-3.9

env:
  DockerImageName: todoapp

concurrency:
  group: python-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  python-ci:
    name: Python CI (${{ matrix.os }}-${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.8"
            artifact-name: ubuntu-3.8

          - os: ubuntu-latest
            python-version: "3.9"
            artifact-name: ubuntu-3.9

          - os: windows-latest
            python-version: "3.8"
            artifact-name: windows-3.8

          - os: windows-latest
            python-version: "3.9"
            artifact-name: windows-3.9

    defaults:
      run:
        working-directory: ./src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coverage flake8
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python manage.py test

      - name: Generate coverage report
        run: |
          coverage run --source='.' manage.py test
          coverage report

      - name: Linting
        run: |
          flake8 . --show-source --statistics --exit-zero

      - name: Check Complexity
        run: |
          flake8 . --exit-zero --max-complexity=6

      - name: Upload Python artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ./src


  docker-ci:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: python-ci

    if: github.ref_name == 'main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: ./src
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DockerImageName }}:${{ github.sha }}


  helm-ci:
    name: Helm CI
    runs-on: ubuntu-latest
    needs: python-ci

    if: github.ref_name == 'main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Helm
        uses: azure/setup-helm@v4.2.0

      - name: Lint Helm
        run: |
          helm lint ./helm-charts/todoapp/

      - name: Template Helm
        run: |
          helm template todoapp ./helm-charts/todoapp/ \
            -f ./helm-charts/todoapp/values.yaml

      - name: Package Helm
        run: |
          helm package ./helm-charts/todoapp

      - name: Upload Helm Package
        uses: actions/upload-artifact@v4
        with:
          name: helm-package
          path: ./*.tgz


  deploy-helm-dev:
    name: Deploy Helm to Development
    uses: ./.github/workflows/reusable-deployment.yml
    needs:
      - helm-ci
      - docker-ci

    secrets: inherit

    with:
      environment: development
      version: ${{ github.sha }}


  deploy-helm-stg:
    name: Deploy Helm to Staging
    uses: ./.github/workflows/reusable-deployment.yml
    needs:
      - deploy-helm-dev

    secrets: inherit

    with:
      environment: staging
      version: ${{ github.sha }}
      helm-values-path: ./todoapp/values/stg.yaml
      helm-release-name: todoapp-staging