name: python-deployment

run-name: ${{ github.actor }} - ${{ github.ref_name}} - ${{ github.sha }}

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      deploy_artifact:
        description: 'Select artifact to deploy (requires manual selection)'
        type: choice
        options:
          - ubuntu-3.8
          - ubuntu-3.9
          - windows-3.8
          - windows-3.9

env:
  DockerImageName: igorrrrrrrrr/todoapp

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-ci:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.8', '3.9']
      fail-fast: false

    if: >
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.deploy_artifact, matrix.os == 'ubuntu-latest' && 'ubuntu' || 'windows') &&
      contains(github.event.inputs.deploy_artifact, matrix.python-version)

    defaults:
      run:
        working-directory: ./src
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - run: |
          python -m pip install --upgrade pip
          pip install coverage flake8
          pip install -r requirements.txt

      - run: python manage.py test

      - run: |
          coverage run --source='.' manage.py test
          coverage report

      - run: flake8 . --show-source --statistics --exit-zero

      - run: flake8 . --exit-zero --max-complexity=6

      - uses: actions/upload-artifact@v4
        with:
          name: python-artifacts-${{ matrix.os }}-${{ matrix.python-version }}
          path: .
          retention-days: 5

      - if: github.ref_name == 'main' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.9'
        uses: actions/upload-artifact@v4
        with:
          name: helm-artifacts
          path: ${{ github.workspace }}/helm-charts
          retention-days: 5

      - if: github.ref_name == 'main' && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.9'
        uses: actions/upload-artifact@v4
        with:
          name: kind-cluster
          path: ${{ github.workspace }}/cluster.yml
          retention-days: 5

  docker-ci:
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'main' && github.event_name == 'push' }}
    needs: python-ci
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          push: true
          context: ./src
          tags: |
            ${{ env.DockerImageName }}:${{ github.sha }}
            ${{ env.DockerImageName }}:latest

  helm-ci:
    runs-on: ubuntu-latest
    needs: python-ci
    if: github.ref_name == 'main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: helm-artifacts
          path: .
      - uses: azure/setup-helm@v4.2.0
      - run: helm lint ./todoapp/
      - run: helm template todoapp ./todoapp/ -f ./todoapp/values.yaml
      - run: helm package ./todoapp
      - uses: actions/upload-artifact@v4
        with:
          name: helm-package
          path: ./*.tgz
          retention-days: 5

  deploy-helm-dev:
    uses: ./.github/workflows/reusable-deployment.yml
    needs: [helm-ci, docker-ci]
    secrets: inherit
    with:
      environment: development
      version: ${{ github.sha }}

  deploy-helm-stg:
    uses: ./.github/workflows/reusable-deployment.yml
    needs: [deploy-helm-dev]
    secrets: inherit
    with:
      environment: staging
      version: ${{ github.sha }}
      helm-values-path: ./todoapp/values/stg.yaml
      helm-release-name: todoapp-staging
      