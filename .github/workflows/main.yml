name: Python, Docker, Helm and Kubernetes CI/CD

run-name: ${{ github.actor }} - ${{ github.ref_name }} - ${{ github.sha }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_artifact:
        description: Artifact to build and deploy
        required: true
        default: ubuntu-3.9
        type: choice
        options:
          - ubuntu-3.8
          - ubuntu-3.9
          - windows-3.8
          - windows-3.9

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DockerImageName: todoapp

jobs:
  python-tests:
    name: Python tests (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.8"
            artifact: ubuntu-3.8
          - os: ubuntu-22.04
            python-version: "3.9"
            artifact: ubuntu-3.9
          - os: windows-2022
            python-version: "3.8"
            artifact: windows-3.8
          - os: windows-2022
            python-version: "3.9"
            artifact: windows-3.9

    defaults:
      run:
        working-directory: ./src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install coverage flake8
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test

      - name: Generate coverage
        run: |
          coverage run --source=. manage.py test
          coverage report

      - name: Lint code
        run: flake8 . --show-source --statistics --exit-zero

      - name: Check complexity
        run: flake8 . --exit-zero --max-complexity=6

      - name: Upload Python artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src
          if-no-files-found: error
          retention-days: 7

  python-ci:
    name: Python CI
    if: ${{ always() }}
    needs: python-tests
    runs-on: ubuntu-latest

    steps:
      - name: Verify matrix result
        shell: bash
        run: |
          if [[ "${{ needs.python-tests.result }}" != "success" ]]; then
            echo "One or more matrix tests failed"
            exit 1
          fi

          echo "All matrix tests passed"

  docker-ci:
    name: Build and Push Image
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' }}
    needs: python-ci
    runs-on: ubuntu-latest

    steps:
      - name: Download selected Python artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_artifact || 'ubuntu-3.9' }}
          path: ./src

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DockerImageName }}:${{ github.sha }}

  helm-ci:
    name: Helm CI
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == 'main' }}
    needs: python-ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0

      - name: Lint Helm chart
        run: helm lint ./helm-charts/todoapp

      - name: Render Helm templates
        run: |
          helm template todoapp ./helm-charts/todoapp \
            --values ./helm-charts/todoapp/values.yaml \
            > /dev/null

      - name: Package Helm chart
        run: helm package ./helm-charts/todoapp

      - name: Upload Helm source artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-artifacts
          path: helm-charts
          if-no-files-found: error

      - name: Upload kind cluster artifact
        uses: actions/upload-artifact@v4
        with:
          name: kind-cluster
          path: cluster.yml
          if-no-files-found: error

      - name: Upload Helm package
        uses: actions/upload-artifact@v4
        with:
          name: helm-package
          path: ./*.tgz
          if-no-files-found: error

  deploy-helm-dev:
    name: Deploy Helm to Development
    needs:
      - helm-ci
      - docker-ci
    uses: ./.github/workflows/reusable-deployment.yml
    secrets: inherit
    with:
      environment: development
      version: ${{ github.sha }}

  deploy-helm-stg:
    name: Deploy Helm to Staging
    needs: deploy-helm-dev
    uses: ./.github/workflows/reusable-deployment.yml
    secrets: inherit
    with:
      environment: staging
      version: ${{ github.sha }}
      helm-values-path: ./todoapp/values/stg.yaml
      helm-release-name: todoapp-staging