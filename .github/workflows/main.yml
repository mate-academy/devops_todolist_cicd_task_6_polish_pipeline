name: python-deployment

run-name: ${{ github.actor }} - ${{ github.ref_name}} -${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      deploy_artifact:
        description: Matrix artifact to deploy
        required: true
        default: ubuntu-3.8
        type: choice
        options:
          - ubuntu-3.8
          - ubuntu-3.9
          - windows-3.8
          - windows-3.9
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DockerImageName: todoapp

jobs:
  python-ci:
    name: python-ci-${{ matrix.os }}-${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.9"]
    defaults:
      run:
        working-directory: ./src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coverage flake8
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python manage.py test

      - name: Generate Report
        run: |
          coverage run --source='.' manage.py test
          coverage report

      - name: Linting
        run: |
          flake8 . --show-source --statistics --exit-zero

      - name: Check Complexity
        run: |
          flake8 . --exit-zero --max-complexity=6

      - name: Upload python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-artifacts-${{ matrix.os == 'ubuntu-latest' && 'ubuntu' || 'windows' }}-${{ matrix.python-version }}
          path: src/

  python-ci-status:
    name: Python CI
    runs-on: ubuntu-latest
    needs: python-ci
    if: always()
    steps:
      - name: Fail if matrix failed
        run: |
          if [ "${{ needs.python-ci.result }}" != "success" ]; then
            echo "python-ci matrix failed"
            exit 1
          fi

  prepare-deploy-artifacts:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
    needs: python-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload helm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: helm-artifacts
          path: ${{ github.workspace }}/helm-charts

      - name: Upload kind cluster artifact
        uses: actions/upload-artifact@v4
        with:
          name: kind-cluster
          path: ${{ github.workspace }}/cluster.yml

  docker-ci:
    name: Build and Push Image
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'main' || github.event_name == 'workflow_dispatch' }}
    needs: python-ci
    steps:

    - uses: actions/download-artifact@v4
      name: Download selected matrix artifact
      with:
        name: python-artifacts-${{ github.event_name == 'workflow_dispatch' && inputs.deploy_artifact || 'ubuntu-3.8' }}
        path: .

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        push: true
        context: ./src
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DockerImageName }}:${{ github.sha }}

  helm-ci:
    runs-on: ubuntu-latest
    needs: prepare-deploy-artifacts
    if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
    name: Helm CI
    steps:

    - uses: actions/download-artifact@v4
      with:
        name: helm-artifacts
        path: .

    - name: Set Up Helm
      uses: azure/setup-helm@v4.2.0

    - name: Lint helm
      run: helm lint ./todoapp/

    - name: Template Helm
      run: helm template todoapp ./todoapp/ -f ./todoapp/values.yaml

    - name: Package Helm
      run: helm package ./todoapp

    - name: Upload Helm Artifact
      uses: actions/upload-artifact@v4
      with:
        name: helm-package
        path: ./*.tgz

  deploy-helm-dev:
    name: Deploy helm to Development
    uses: ./.github/workflows/reusable-deployment.yml
    needs: [helm-ci, docker-ci]
    secrets: inherit
    with:
      environment: development
      version: ${{ github.sha }}
      artifact-name: python-artifacts-${{ github.event_name == 'workflow_dispatch' && inputs.deploy_artifact || 'ubuntu-3.8' }}

  deploy-helm-stg:
    name: Deploy helm to Staging
    uses: ./.github/workflows/reusable-deployment.yml
    needs: [deploy-helm-dev]
    secrets: inherit
    with:
      environment: staging
      version: ${{ github.sha }}
      helm-values-path: ./todoapp/values/stg.yaml
      helm-release-name: todoapp-staging
      artifact-name: python-artifacts-${{ github.event_name == 'workflow_dispatch' && inputs.deploy_artifact || 'ubuntu-3.8' }}